# Deploys to Cloudflare when started by hand from the Actions tab.
# Needs the repository secret CLOUDFLARE_API_TOKEN; the account id is in wrangler.toml (see docs/DEPLOY.md).
# "target" picks the copy: production (Cloudflare Access) or demo (password sign-in, see docs/DEMO.md).
name: Deploy
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which copy to deploy
        type: choice
        options: [production, demo]
        default: production
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Apply database migrations (production)
        if: inputs.target != 'demo'
        run: npx wrangler d1 migrations apply moa-scheduler --remote
      - name: Deploy Worker (production)
        if: inputs.target != 'demo'
        run: npx wrangler deploy
      - name: Apply database migrations (demo)
        if: inputs.target == 'demo'
        run: npx wrangler d1 migrations apply moa-scheduler-demo --remote --env demo
      - name: Deploy Worker (demo)
        if: inputs.target == 'demo'
        run: npx wrangler deploy --env demo
