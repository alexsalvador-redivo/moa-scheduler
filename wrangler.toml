name = "moa-scheduler"
main = "src/worker.js"
compatibility_date = "2025-10-01"
account_id = "9c1eb8cceb8f4438b78df1aeaa8561da"

# Front end (public/) and API (src/worker.js) ship as one Worker.
[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "moa-scheduler"
database_id = "346e5a26-4dfc-44d6-bd28-008e603211bc"
migrations_dir = "migrations"

# Production settings (see docs/DEPLOY.md). Until ACCESS_TEAM_DOMAIN and
# ACCESS_AUD are set, every API call is refused: the app fails closed.
# Never set DEV_LOGIN here; it belongs only in a local .dev.vars file.
[vars]
ACCESS_TEAM_DOMAIN = "flat-wildflower-6001.cloudflareaccess.com"   # e.g. "maplegrove.cloudflareaccess.com"
ACCESS_AUD = "ae50e460f17cd1ec405bb1282a0f9abf3463e8c1a94c2bf098c9dc88b036c5f6"           # the Access application's Audience (AUD) tag
MAIL_FROM = ""            # e.g. "Maple Grove Schedule <schedule@maplegrove.ca>"
# DEMO_MODE adds "Reset demo data" to Clinic setup and a "view as" switcher on My shifts
# for managers. Turn it off ("false") before a real clinic uses this deployment.
DEMO_MODE = "true"
APP_URL = "https://moa-scheduler.alexsalvador.workers.dev"              # e.g. "https://schedule.maplegrove.ca"

# ---------------------------------------------------------------------------
# Public demo copy: its own Worker and its own database, no Cloudflare Access.
# People sign in with a user ID and the shared password in the Worker secret
# DEMO_PASSWORD (set it with: npx wrangler secret put DEMO_PASSWORD --env demo).
# Deploy with: npx wrangler deploy --env demo  (or the Deploy workflow, target "demo").
# Nothing above changes production; settings here apply only with --env demo.
# See docs/DEMO.md.
[env.demo]
name = "moa-scheduler-demo"

[env.demo.assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[env.demo.d1_databases]]
binding = "DB"
database_name = "moa-scheduler-demo"
database_id = "REPLACE_WITH_DEMO_DATABASE_ID"   # from: npx wrangler d1 create moa-scheduler-demo
migrations_dir = "migrations"

[env.demo.vars]
AUTH_MODE = "password"
DEMO_MODE = "true"
MAIL_FROM = ""            # leave empty: the demo never sends email
APP_URL = ""
